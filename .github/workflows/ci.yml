name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Test
        run: python -m pytest -q
      - name: Static preview is up to date
        run: |
          python tools/build_preview.py
          git diff --exit-code -- docs || (echo "::error::docs/ is stale - run python tools/build_preview.py and commit" && exit 1)
