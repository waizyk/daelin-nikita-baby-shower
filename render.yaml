services:
  - type: web
    name: daelin-nikita-baby-shower
    runtime: python
    plan: starter          # free tier wipes disk on restart; use a disk below
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true     # Render creates a long random value
      - key: HOST_PIN
        sync: false             # you type it in the dashboard; never committed
      - key: PUBLIC_URL
        sync: false
    disk:
      name: albm-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
