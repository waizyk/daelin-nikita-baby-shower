{% import "_art.html" as art %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Printable sign — add your photos</title>
<style>
  :root{
    --cream:#FFFCF4; --butter:#FDF3D6; --butter-deep:#F7E4AE; --honey:#E8B04B; --honey-deep:#C8892B;
    --sage:#8FAE86; --sage-pale:#E4EEDF; --blush:#F3C9C3; --ink:#4A3E31; --ink-soft:#7A6A59;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#EFEAE0;font-family:var(--sans);color:var(--ink);
       display:grid;place-items:center;min-height:100vh;padding:24px}
  .sheet{
    width:210mm;min-height:297mm;background:var(--cream);position:relative;
    padding:18mm 16mm;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;box-shadow:0 20px 50px -20px rgba(74,62,49,.5);overflow:hidden;
  }
  .sheet::before{
    content:"";position:absolute;inset:7mm;border:2px dashed var(--butter-deep);border-radius:10mm;
  }
  .inner{position:relative;z-index:2;width:100%}
  .eyebrow{font-size:10.5pt;letter-spacing:.3em;text-transform:uppercase;color:var(--honey-deep);
           font-weight:700;margin:0 0 6mm}
  h1{font-family:var(--serif);font-size:30pt;line-height:1.15;margin:0 0 3mm}
  h1 em{color:var(--honey-deep)}
  .sub{font-family:var(--serif);font-style:italic;font-size:14pt;color:var(--sage);margin:0 0 9mm}
  .qrbox{background:#fff;padding:7mm;border-radius:8mm;display:inline-block;
         box-shadow:0 10px 26px -14px rgba(74,62,49,.55);border:1px solid rgba(143,174,134,.25)}
  .qrbox img{display:block;width:82mm;height:82mm}
  .how{margin:9mm 0 0;font-size:13.5pt;line-height:1.7;max-width:130mm}
  .how b{color:var(--honey-deep)}
  .url{margin:6mm 0 0;font-size:10.5pt;color:var(--ink-soft);word-break:break-all}
  .url code{background:var(--butter);padding:1.5mm 3mm;border-radius:2mm}
  .deco{position:absolute;opacity:.9}
  .d1{top:-8mm;left:-8mm;width:52mm;transform:rotate(-12deg)}
  .d2{bottom:-4mm;right:-2mm;width:44mm}
  .d3{top:16mm;right:14mm;width:20mm}
  .d4{bottom:34mm;left:14mm;width:17mm}
  .row{display:flex;gap:6mm;justify-content:center;margin-top:10mm;align-items:flex-end}
  .row svg{width:26mm}
  .tabs-hint{display:none}
  .printbtn{
    position:fixed;top:16px;right:16px;background:var(--honey);color:#fff;border:0;
    padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:var(--sans);box-shadow:0 10px 22px -12px rgba(200,137,43,.9);
  }
  @media print{
    body{background:#fff;padding:0;display:block}
    .sheet{box-shadow:none;width:auto;min-height:auto;height:100vh;page-break-after:avoid}
    .printbtn{display:none}
    @page{size:A4 portrait;margin:0}
  }
</style>
</head>
<body>
<button class="printbtn" onclick="window.print()">🖨 Print this sign</button>

<div class="sheet">
  <svg class="deco d1" viewBox="0 0 220 240" aria-hidden="true">{{ art.pooh() }}</svg>
  <svg class="deco d2" viewBox="0 0 100 140" aria-hidden="true">{{ art.piglet() }}</svg>
  <svg class="deco d3" viewBox="0 0 40 40" aria-hidden="true">{{ art.bee(20,20,1.6) }}</svg>
  <svg class="deco d4" viewBox="0 0 40 40" aria-hidden="true">{{ art.bee(20,20,1.3) }}</svg>

  <div class="inner">
    <p class="eyebrow">A Hundred Acre Wood Baby Shower</p>
    <h1>Share your <em>snaps</em><br>with the parents-to-be</h1>
    <p class="sub">{{ EVENT.parents }} · {{ EVENT.date_long }}</p>

    <div class="qrbox">
      <img src="{{ url_for('qr_png') }}" alt="QR code to the photo upload page">
    </div>

    <p class="how">
      <b>1.</b> Open your camera &nbsp;·&nbsp; <b>2.</b> Point it at the code<br>
      <b>3.</b> Add your photos of the day
    </p>
    <p class="url">or type <code>{{ upload_url }}</code></p>

    <div class="row" aria-hidden="true">
      <svg viewBox="0 0 120 110">{{ art.piglet() }}</svg>
      <svg viewBox="0 0 120 110">{{ art.donkey() }}</svg>
      <svg viewBox="0 0 60 60">{{ art.hunny() }}</svg>
    </div>
  </div>
</div>
</body>
</html>
